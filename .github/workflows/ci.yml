name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-windows:
    name: Windows (MinGW-w64) - Build, Security & Test Suite
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW Environment
        run: |
          if (Test-Path "C:\msys64\mingw64\bin") {
            "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } elseif (Test-Path "C:\ProgramData\mingw64\mingw64\bin") {
            "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Verify Compiler
        run: g++ --version

      - name: Build TreeMCP (Ultra-Lightweight Hardened)
        run: cmd /c "build.bat"

      - name: Verify Binary Footprint
        run: |
          $size = (Get-Item TreeMCP.exe).Length
          Write-Host "Binary size: $size bytes"
          if ($size -gt 500000) {
            Write-Error "Binary size exceeds lightweight threshold (500 KB)"
            exit 1
          }

      - name: Run Automated Test Suite (Unit, Security QC, A/B Benchmark)
        run: cmd /c "run_tests.bat"

  build-and-test-linux:
    name: Linux (GCC) - Build, Security & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build TreeMCP via Makefile
        run: make

      - name: Verify Binary Footprint
        run: |
          SIZE=$(stat -c%s treemcp)
          echo "Binary size: $SIZE bytes"
          if [ $SIZE -gt 500000 ]; then
            echo "Binary size exceeds lightweight threshold (500 KB)"
            exit 1
          fi

      - name: Run Automated Test Suite (Unit, Security QC, A/B Benchmark)
        run: |
          chmod +x run_tests.sh
          ./run_tests.sh
